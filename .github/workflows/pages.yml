name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Controle de syntaxe du script embarque
        run: |
          node -e "
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) { throw new Error('script introuvable dans index.html'); }
          fs.writeFileSync('verification.js', m[1]);
          "
          node --check verification.js
          rm verification.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publication
        uses: actions/deploy-pages@v4
